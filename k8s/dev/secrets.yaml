---
# Technitium DNS currently has no Secret or secretKeyRef entries in its manifest,
# so there is no Vault-backed ExternalSecret to add yet.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: rustfs
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: rustfs
spec:
  provider:
    vault:
      server: http://vault-service.vault.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: libraryapp
          serviceAccountRef:
            name: vault-auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-s3-secret
  namespace: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: rclone-s3-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: RCLONE_ACCESS_KEY
      remoteRef:
        key: rclone
        property: access_key
    - secretKey: RCLONE_SECRET_KEY
      remoteRef:
        key: rclone
        property: secret_key
    - secretKey: RCLONE_GUI_USER
      remoteRef:
        key: rclone
        property: gui_user
    - secretKey: RCLONE_GUI_PASS
      remoteRef:
        key: rclone
        property: gui_pass