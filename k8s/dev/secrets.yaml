---
# Technitium DNS currently has no Secret or secretKeyRef entries in its manifest,
# so there is no Vault-backed ExternalSecret to add yet.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: rustfs
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: rustfs
spec:
  provider:
    vault:
      server: http://vault-service.vault.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: libraryapp
          serviceAccountRef:
            name: vault-auth
---
# Separate KV v2 mount ("media") used specifically by capacitarr/autopulse -
# same Vault server/role/SA as vault-backend above, just a different
# path, since a SecretStore only targets one mount at a time.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend-media
  namespace: rustfs
spec:
  provider:
    vault:
      server: http://vault-service.vault.svc.cluster.local:8200
      path: media
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: libraryapp
          serviceAccountRef:
            name: vault-auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-s3-secret
  namespace: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: rclone-s3-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: RCLONE_ACCESS_KEY
      remoteRef:
        key: rclone
        property: access_key
    - secretKey: RCLONE_SECRET_KEY
      remoteRef:
        key: rclone
        property: secret_key
    - secretKey: RCLONE_GUI_USER
      remoteRef:
        key: rclone
        property: gui_user
    - secretKey: RCLONE_GUI_PASS
      remoteRef:
        key: rclone
        property: gui_pass

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-credentials
  namespace: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: rustfs-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: rustfs
        property: access_key
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: rustfs
        property: secret_key

---
# ============================================================
# CAPACITARR
# Flat secret, same pattern as rclone-s3-secret / rustfs-credentials
# above. Requires Vault KV entry:
#   vault kv put kv/capacitarr jwt_secret=$(openssl rand -hex 32)
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: capacitarr-secret
  namespace: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-media
    kind: SecretStore
  target:
    name: capacitarr-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: capacitarr
        property: jwt_secret

---
# ============================================================
# AUTOPULSE
# Flat secret, same pattern as rclone-s3-secret / rustfs-credentials
# above. autopulse reliably supports nested env-var overrides
# (confirmed working: AUTOPULSE__TARGETS__JELLYFIN__TOKEN), so the
# token is injected as a plain env var - no config.yaml templating
# needed. The rest of config.yaml (triggers/targets skeleton, no
# secrets) lives in a plain ConfigMap in capacitarr-autopulse.yaml.
#
# Requires Vault KV entry:
#   vault kv put kv/autopulse jellyfin_token=<your-jellyfin-api-key>
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autopulse-secret
  namespace: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-media
    kind: SecretStore
  target:
    name: autopulse-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: AUTOPULSE__TARGETS__JELLYFIN__TOKEN
      remoteRef:
        key: autopulse
        property: jellyfin_token
    - secretKey: AUTOPULSE__AUTH__USERNAME
      remoteRef:
        key: autopulse
        property: username
    - secretKey: AUTOPULSE__AUTH__PASSWORD
      remoteRef:
        key: autopulse
        property: password

---
# ============================================================
# rustfs-secrets.yaml
#
# Depends on the vault-backend-media SecretStore (and the
# vault-auth ServiceAccount / libraryapp Vault role it uses),
# which already exist in your secrets manifest alongside
# capacitarr-secret and autopulse-secret. This file does not
# redefine that plumbing -- apply your existing secrets manifest
# first (or alongside this one), then this ExternalSecret.
# ============================================================

# ============================================================
# VAULT-BACKED VPN CREDENTIALS (External Secrets Operator)
#
# Reuses the vault-backend-media SecretStore already defined in
# your secrets manifest (same one capacitarr/autopulse use) --
# same Vault server, same "media" KV v2 mount, same vault-auth
# ServiceAccount/libraryapp role. No new ServiceAccount or
# SecretStore needed for qbittorrent.
#
# Vault path: media/data/qbittorrent (KV v2 mount "media",
# secret path "qbittorrent") holds BOTH the VPN credentials and
# the qbittorrent WebUI credentials in one KV object.
#
# One-time Vault-side setup (run once, not part of this manifest):
#
#   vault kv put media/qbittorrent \
#     OPENVPN_USER='your-vpn-username' \
#     OPENVPN_PASSWORD='your-vpn-password' \
#     custom.ovpn=@/path/to/your-config.ovpn \
#     username='your-webui-username' \
#     password='your-webui-password'
#
#   The "custom.ovpn=@/path/to/your-config.ovpn" syntax tells the
#   Vault CLI to read that file's raw contents (not base64 --
#   .ovpn files are plain text) and store it as the value of the
#   custom.ovpn property, multi-line and all. No decodingStrategy
#   needed on the ExternalSecret side; it comes out of Vault and
#   into the qbittorrent-vpn-config Secret's "custom.ovpn" key
#   as the same plain-text file gluetun mounts further down.
#
# NOTE: since libraryapp's policy currently scopes to whatever
# paths it was already granted (e.g. media/data/capacitarr,
# media/data/autopulse), make sure it also covers
# media/data/qbittorrent, e.g.:
#
#   vault policy write libraryapp - <<EOF
#   path "media/data/qbittorrent" {
#     capabilities = ["read"]
#   }
#   EOF
#   (append to the existing libraryapp policy rather than
#   overwrite it, if it already has other path stanzas)
#
# NOTE on QBITTORRENT_USERNAME/PASSWORD: the linuxserver
# qbittorrent image does not accept WebUI credentials via env
# vars -- it generates a random WebUI password on first boot
# (shown in pod logs) and credentials must then be changed via
# the WebUI itself or its config file. These two keys are synced
# into the Secret below and consumed by the set-webui-credentials
# init container further down, which writes them into
# qBittorrent.conf before qbittorrent starts.
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn-config
  namespace: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-media
    kind: SecretStore
  target:
    name: qbittorrent-vpn-config     # <-- consumed by the gluetun sidecar below
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: custom.ovpn
      remoteRef:
        key: qbittorrent
        property: custom.ovpn
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: qbittorrent
        property: username
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: qbittorrent
        property: password