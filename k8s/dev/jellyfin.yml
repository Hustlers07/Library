apiVersion: v1
kind: Namespace
metadata:
  name: rustfs

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rclone-config
  namespace: rustfs
data:
  rclone.conf: |
    [rustfs]
    type = s3
    provider = Other
    env_auth = false
    endpoint = http://rustfs-service.rustfs.svc.cluster.local:9000
    acl = private
    force_path_style = true
    # access_key_id / secret_access_key intentionally omitted here.
    # ConfigMaps do NOT expand $VARS, so they were previously written
    # into rclone.conf as literal strings. Credentials are now supplied
    # exclusively via RCLONE_CONFIG_RUSTFS_* env vars below.

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-cache
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: rustfs
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: rclone-mount
          image: rclone/rclone:1.67.0
          securityContext:
            privileged: true
            capabilities:
              add: [ "SYS_ADMIN" ]
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /media/movies
              # Force-clean any stale FUSE handle left behind by a previous
              # container instance (crash, OOM, node reboot, probe-triggered
              # restart, etc.) before attempting to mount again. Without this,
              # a leftover mount entry can make the new `rclone mount` fail
              # with errors like "transport endpoint is not connected" or
              # "mountpoint already exists".
              fusermount -uz /media/movies 2>/dev/null || umount -l /media/movies 2>/dev/null || true
              exec rclone mount rustfs:movies /media/movies \
                --allow-other \
                --allow-non-empty \
                --vfs-cache-mode full \
                --vfs-cache-max-size 2G \
                --vfs-cache-max-age 2h \
                --s3-no-check-bucket \
                --log-level INFO
          env:
            # Remote-specific env vars (RCLONE_CONFIG_<REMOTE>_<OPTION>)
            # target the [rustfs] remote specifically, rather than
            # RCLONE_S3_* which applies to any s3-type remote.
            - name: RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_ACCESS_KEY
            - name: RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_SECRET_KEY
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
            - name: rustfs-movies-mount
              mountPath: /media/movies
              mountPropagation: Bidirectional
            - name: fuse-device
              mountPath: /dev/fuse
          livenessProbe:
            # Checks that the FUSE mount is attached (mountpoint -q) and
            # responsive (ls succeeds) without depending on any specific
            # object/prefix existing in the S3 bucket. The previous check
            # (`test -d /media/movies/.thumb`) assumed a `.thumb` object
            # existed in the bucket, which is not guaranteed and caused
            # false-positive failures -> unnecessary restarts -> stale
            # FUSE mounts on the next attempt.
            exec:
              command:
                - /bin/sh
                - -c
                - "mountpoint -q /media/movies && ls /media/movies >/dev/null 2>&1"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3

        - name: rclone-mount-tv
          # Mirrors the movies rclone-mount sidecar above, but for the TV
          # library (rustfs:tv bucket/prefix). Previously TV had no S3 sync
          # at all - /mnt/jellyfin-tv was a plain hostPath only, so the TV
          # library was NOT backed up to/served from rustfs like movies are.
          image: rclone/rclone:1.67.0
          securityContext:
            privileged: true
            capabilities:
              add: [ "SYS_ADMIN" ]
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /media/tv
              fusermount -uz /media/tv 2>/dev/null || umount -l /media/tv 2>/dev/null || true
              exec rclone mount rustfs:tv /media/tv \
                --allow-other \
                --allow-non-empty \
                --vfs-cache-mode full \
                --vfs-cache-max-size 2G \
                --vfs-cache-max-age 2h \
                --s3-no-check-bucket \
                --log-level INFO
          env:
            - name: RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_ACCESS_KEY
            - name: RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_SECRET_KEY
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
            - name: rustfs-tv-mount
              mountPath: /media/tv
              mountPropagation: Bidirectional
            - name: fuse-device
              mountPath: /dev/fuse
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mountpoint -q /media/tv && ls /media/tv >/dev/null 2>&1"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3

        - name: jellyfin
          image: jellyfin/jellyfin:latest
          # Use linuxserver image for better ffmpeg/codec support
          # image: lscr.io/linuxserver/jellyfin:latest
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: http://groot-server:30097
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-cache
              mountPath: /cache
            - name: rustfs-movies-mount
              mountPath: /media/movies
              mountPropagation: HostToContainer
            - name: rustfs-tv-mount
              mountPath: /media/tv
              mountPropagation: HostToContainer
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

      volumes:
        - name: rclone-config
          configMap:
            name: rclone-config
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: jellyfin-cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: rustfs-movies-mount
          hostPath:
            path: /mnt/jellyfin-rustfs
            type: DirectoryOrCreate
        - name: rustfs-tv-mount
          # Same host path Sonarr already mounts (see servarr manifest),
          # now also FUSE-mounted here to rustfs:tv for S3 sync/serving.
          hostPath:
            path: /mnt/jellyfin-tv
            type: DirectoryOrCreate
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: rustfs
  labels:
    app: jellyfin
spec:
  selector:
    app: jellyfin
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8096
      targetPort: 8096