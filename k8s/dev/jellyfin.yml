apiVersion: v1
kind: Namespace
metadata:
  name: rustfs

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rclone-config
  namespace: rustfs
data:
  rclone.conf: |
    [rustfs]
    type = s3
    provider = Other
    env_auth = false
    endpoint = http://rustfs-service.rustfs.svc.cluster.local:9000
    acl = private
    force_path_style = true
    # access_key_id / secret_access_key intentionally omitted here.
    # ConfigMaps do NOT expand $VARS, so they were previously written
    # into rclone.conf as literal strings. Credentials are now supplied
    # exclusively via RCLONE_CONFIG_RUSTFS_* env vars below.

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-cache
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: rustfs
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: rclone-mount
          image: rclone/rclone:1.67.0
          securityContext:
            privileged: true
            capabilities:
              add: [ "SYS_ADMIN" ]
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /media/movies
              exec rclone mount rustfs:movies /media/movies \
                --allow-other \
                --allow-non-empty \
                --vfs-cache-mode full \
                --vfs-cache-max-size 2G \
                --vfs-cache-max-age 2h \
                --s3-no-check-bucket \
                --log-level INFO
          env:
            # Remote-specific env vars (RCLONE_CONFIG_<REMOTE>_<OPTION>)
            # target the [rustfs] remote specifically, rather than
            # RCLONE_S3_* which applies to any s3-type remote.
            - name: RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_ACCESS_KEY
            - name: RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_SECRET_KEY
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
            - name: rustfs-mount
              mountPath: /media/movies
              mountPropagation: Bidirectional
            - name: fuse-device
              mountPath: /dev/fuse
          livenessProbe:
            # If the FUSE mount dies or goes stale ("transport endpoint
            # is not connected"), `mountpoint -q` will fail and k8s will
            # restart this container automatically, instead of leaving
            # a broken mountpoint for every other pod that reads it.
            exec:
              command:
                - /bin/sh
                - -c
                - "mountpoint -q /media/movies && test -d /media/movies/.thumb"
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

        - name: jellyfin
          image: jellyfin/jellyfin:latest
          # Use linuxserver image for better ffmpeg/codec support
          # image: lscr.io/linuxserver/jellyfin:latest
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: http://groot-server:30097
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-cache
              mountPath: /cache
            - name: rustfs-mount
              mountPath: /media/movies
              mountPropagation: HostToContainer
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

      volumes:
        - name: rclone-config
          configMap:
            name: rclone-config
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: jellyfin-cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: rustfs-mount
          hostPath:
            path: /mnt/jellyfin-rustfs
            type: DirectoryOrCreate
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: rustfs
  labels:
    app: jellyfin
spec:
  selector:
    app: jellyfin
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8096
      targetPort: 8096