apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-funnel
  namespace: rustfs
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/tags: "tag:k8s"
spec:
  defaultBackend:
    service:
      name: jellyfin-service
      port:
        number: 8096
  ingressClassName: tailscale
  tls:
  - hosts:
    - jellyfin