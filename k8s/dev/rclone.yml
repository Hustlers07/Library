apiVersion: v1
kind: Namespace
metadata:
  name: rustfs

---
apiVersion: v1
kind: Secret
metadata:
  name: rclone-s3-secret
  namespace: rustfs
type: Opaque
stringData:
  RCLONE_ACCESS_KEY: $RCLONE_ACCESS_KEY
  RCLONE_SECRET_KEY: $RCLONE_SECRET_KEY
  RCLONE_GUI_USER: $RCLONE_GUI_USER
  RCLONE_GUI_PASS: $RCLONE_GUI_PASS

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rclone-config
  namespace: rustfs
data:
  rclone.conf: |
    [rustfs]
    type = s3
    provider = Other
    env_auth = false
    endpoint = http://rustfs-service.rustfs.svc.cluster.local:9000
    acl = private
    force_path_style = true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: rustfs
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /mnt/rustfs;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;

      location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Accept-Ranges bytes;
      }

      send_timeout 300s;
      keepalive_timeout 300s;
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rclone-nginx
  namespace: rustfs
  labels:
    app: rclone-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rclone-nginx
  template:
    metadata:
      labels:
        app: rclone-nginx
    spec:
      containers:
        - name: rclone-mount
          image: rclone/rclone:latest
          securityContext:
            privileged: true
            capabilities:
              add: [ "SYS_ADMIN" ]
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /mnt/rustfs/movies
              exec rclone mount rustfs:movies /mnt/rustfs/movies \
                --allow-other \
                --allow-non-empty \
                --vfs-cache-mode full \
                --vfs-cache-max-size 1G \
                --vfs-cache-max-age 1h \
                --log-level INFO
          env:
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_ACCESS_KEY
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_SECRET_KEY
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
            - name: rustfs-mount
              mountPath: /mnt/rustfs
              mountPropagation: Bidirectional
            - name: fuse-device
              mountPath: /dev/fuse

        - name: rclone-gui
          image: rclone/rclone:latest
          command: ["rclone","rcd","--rc-web-gui","--rc-web-gui-no-open-browser","--rc-addr=0.0.0.0:5572"]
          envFrom:
            - secretRef:
                name: rclone-s3-secret
          ports:
            - containerPort: 5572
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone

        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: rustfs-mount
              mountPath: /mnt/rustfs

      volumes:
        - name: rclone-config
          configMap:
            name: rclone-config
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: rustfs-mount
          emptyDir: {}
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice

---
apiVersion: v1
kind: Service
metadata:
  name: rclone-gui
  namespace: rustfs
spec:
  selector:
    app: rclone-nginx
  ports:
    - port: 5572
      targetPort: 5572
      nodePort: 31572
  type: NodePort

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-media
  namespace: rustfs
spec:
  selector:
    app: rclone-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
  type: NodePort
