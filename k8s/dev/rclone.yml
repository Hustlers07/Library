apiVersion: v1
kind: Namespace
metadata:
  name: rustfs

---
apiVersion: v1
kind: Secret
metadata:
  name: rclone-s3-secret
  namespace: rustfs
type: Opaque
stringData:
  RCLONE_ACCESS_KEY: $RCLONE_ACCESS_KEY
  RCLONE_SECRET_KEY: $RCLONE_SECRET_KEY
  RCLONE_GUI_USER: $RCLONE_GUI_USER
  RCLONE_GUI_PASS: $RCLONE_GUI_PASS

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rclone-config
  namespace: rustfs
data:
  rclone.conf: |
    [rustfs]
    type = s3
    provider = Other
    env_auth = false
    endpoint = http://rustfs-service.rustfs.svc.cluster.local:9000
    access_key_id = $RCLONE_ACCESS_KEY
    secret_access_key = $RCLONE_SECRET_KEY
    acl = private
    force_path_style = true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rclone-nginx
  namespace: rustfs
  labels:
    app: rclone-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rclone-nginx
  template:
    metadata:
      labels:
        app: rclone-nginx
    spec:
      containers:
        - name: rclone-mount
          image: rclone/rclone:1.67.0
          securityContext:
            privileged: true
            capabilities:
              add: [ "SYS_ADMIN" ]
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /mnt/rustfs/movies
              exec rclone mount rustfs:movies /mnt/rustfs/movies \
                --allow-other \
                --allow-non-empty \
                --vfs-cache-mode full \
                --vfs-cache-max-size 1G \
                --vfs-cache-max-age 1h \
                --log-level INFO
          env:
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_ACCESS_KEY
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_SECRET_KEY
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
            - name: rustfs-mount
              mountPath: /mnt/rustfs
              mountPropagation: Bidirectional
            - name: fuse-device
              mountPath: /dev/fuse

        - name: rclone-gui
          image: rclone/rclone:1.67.0
          command:
            - /bin/sh
            - -c
            - |
              exec rclone rcd \
                --rc-web-gui \
                --rc-web-gui-no-open-browser \
                --rc-addr=0.0.0.0:5572 \
                --rc-user=$RCLONE_GUI_USER \
                --rc-pass=$RCLONE_GUI_PASS
          envFrom:
            - secretRef:
                name: rclone-s3-secret
          ports:
            - containerPort: 5572
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
          readinessProbe:
            tcpSocket:
              port: 5572
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5572
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

        - name: rclone-sftp
          image: rclone/rclone:1.67.0
          command:
            - /bin/sh
            - -c
            - |
              exec rclone serve sftp rustfs: \
                --addr :2222 \
                --user $RCLONE_GUI_USER \
                --pass $RCLONE_GUI_PASS \
                --vfs-cache-mode full \
                --vfs-cache-max-size 1G \
                --log-level INFO
          envFrom:
            - secretRef:
                name: rclone-s3-secret
          ports:
            - containerPort: 2222
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone

      volumes:
        - name: rclone-config
          configMap:
            name: rclone-config
        - name: rustfs-mount
          emptyDir: {}
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice

---
apiVersion: v1
kind: Service
metadata:
  name: rclone-gui
  namespace: rustfs
spec:
  selector:
    app: rclone-nginx
  ports:
    - port: 5572
      targetPort: 5572
      nodePort: 31572
  type: NodePort

---
apiVersion: v1
kind: Service
metadata:
  name: rclone-sftp
  namespace: rustfs
spec:
  selector:
    app: rclone-nginx
  ports:
    - name: sftp
      port: 2222
      targetPort: 2222
      nodePort: 32222
  type: NodePort

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-cache
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: rustfs
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: rclone-mount
          image: rclone/rclone:1.67.0
          securityContext:
            privileged: true
            capabilities:
              add: [ "SYS_ADMIN" ]
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /media/movies
              exec rclone mount rustfs:movies /media/movies \
                --allow-other \
                --allow-non-empty \
                --vfs-cache-mode full \
                --vfs-cache-max-size 2G \
                --vfs-cache-max-age 2h \
                --log-level INFO
          env:
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_ACCESS_KEY
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rclone-s3-secret
                  key: RCLONE_SECRET_KEY
          volumeMounts:
            - name: rclone-config
              mountPath: /config/rclone
            - name: rustfs-mount
              mountPath: /media/movies
              mountPropagation: Bidirectional
            - name: fuse-device
              mountPath: /dev/fuse

        - name: jellyfin
          image: jellyfin/jellyfin:latest
          # Use linuxserver image for better ffmpeg/codec support
          # image: lscr.io/linuxserver/jellyfin:latest
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: http://groot-server:30097
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-cache
              mountPath: /cache
            - name: rustfs-mount
              mountPath: /media/movies
              mountPropagation: HostToContainer
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

      volumes:
        - name: rclone-config
          configMap:
            name: rclone-config
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: jellyfin-cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: rustfs-mount
          hostPath:
            path: /mnt/jellyfin-rustfs
            type: DirectoryOrCreate
        - name: fuse-device
          hostPath:
            path: /dev/fuse
            type: CharDevice

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: rustfs
  labels:
    app: jellyfin
spec:
  selector:
    app: jellyfin
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8096
      targetPort: 8096