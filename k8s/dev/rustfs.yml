apiVersion: v1
kind: Namespace
metadata:
  name: rustfs
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rustfs-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /home/groot/Documents/rustfs
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-pvc
  namespace: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  volumeName: rustfs-pv
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs
  labels:
    app: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      nodeSelector:
        kubernetes.io/hostname: "groot-server"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      initContainers:
      - name: init-chown-data
        image: busybox:1.36
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -c
        - |
          mkdir -p /data /logs
          chmod -R 777 /data /logs
          echo "Permissions set successfully"
        volumeMounts:
        - name: rustfs-data
          mountPath: /data
        - name: rustfs-logs
          mountPath: /logs
      containers:
      - name: rustfs
        image: rustfs/rustfs:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        ports:
        - name: s3
          containerPort: 9000
          hostPort: 9000
        - name: console
          containerPort: 9001
          hostPort: 9001
        env:
        - name: RUSTFS_CONSOLE_ENABLE
          value: "true"
        - name: RUSTFS_ADDRESS
          value: ":9000"
        - name: RUSTFS_CONSOLE_ADDRESS
          value: ":9001"
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-credentials
              key: RUSTFS_ACCESS_KEY
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-credentials
              key: RUSTFS_SECRET_KEY
        volumeMounts:
        - name: rustfs-data
          mountPath: /data
        - name: rustfs-logs
          mountPath: /logs
        readinessProbe:
          httpGet:
            path: /health
            port: 9001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 9001
          initialDelaySeconds: 20
          periodSeconds: 20
      volumes:
      - name: rustfs-data
        persistentVolumeClaim:
          claimName: rustfs-pvc
      - name: rustfs-logs
        hostPath:
          path: /home/groot/Documents/rustfs/logs
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-service
  namespace: rustfs
  labels:
    app: rustfs
spec:
  selector:
    app: rustfs
  ports:
  - name: s3
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  type: ClusterIP
