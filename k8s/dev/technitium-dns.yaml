apiVersion: v1
kind: Namespace
metadata:
  name: technitium-dns

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: technitium-dns-pvc
  namespace: technitium-dns
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium-dns
  namespace: technitium-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: technitium-dns
  template:
    metadata:
      labels:
        app: technitium-dns
    spec:
      containers:
        - name: technitium-dns
          image: technitium/dns-server:latest
          ports:
            - containerPort: 53
              hostPort: 53
              protocol: UDP
            - containerPort: 53
              hostPort: 53
              protocol: TCP
            - containerPort: 5380
              hostPort: 5380
              protocol: TCP
          volumeMounts:
            - name: dns-data
              mountPath: /var/lib/technitium
      volumes:
        - name: dns-data
          persistentVolumeClaim:
            claimName: technitium-dns-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: technitium-dns-service
  namespace: technitium-dns
spec:
  selector:
    app: technitium-dns
  ports:
    - name: web-admin
      port: 5380
      protocol: TCP
      targetPort: 5380
