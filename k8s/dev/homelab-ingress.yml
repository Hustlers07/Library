# ─── rustfs namespace: RustFS on its own subdomain (HTTPS only) ───
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs-ingressroute
  namespace: rustfs
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rustfs.home.lab.local`)
      kind: Rule
      services:
        - name: rustfs-service
          port: 9001
  tls:
    secretName: local-cert-tls

