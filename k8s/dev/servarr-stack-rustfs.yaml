---
# ============================================================
# Reuses the "rustfs" namespace your Jellyfin manifest already
# creates. Safe to apply even if the namespace already exists.
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: rustfs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: servarr-env
  namespace: rustfs
data:
  PUID: "1000"
  PGID: "1000"
  TZ: "Etc/UTC"          # match whatever Jellyfin is using
---
# ============================================================
# CONFIG VOLUMES (one per app, small, RWO)
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: rustfs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: rustfs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: rustfs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: rustfs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
# ============================================================
# QBITTORRENT (behind a gluetun VPN sidecar)
#
# Downloads go to a plain hostPath (NOT the rclone/S3 mount) -
# torrent clients need normal random-write local disk. Sonarr
# and Radarr will later move/copy completed downloads into the
# media path.
#
# NOTE: downloads hostPath moved from /mnt/downloads (/dev/sda2,
# 46G total, was hitting disk-pressure at 84% usage) to
# /home/groot/downloads (/dev/sda4, 404G total, ~260G free).
# Existing data was rsynced over before this change; see runbook.
#
# GLUETUN: shares this pod's network namespace, so once its
# OpenVPN tunnel is up, ALL traffic from qbittorrent (including
# torrent traffic) is forced through the VPN. If the tunnel
# drops, gluetun's firewall blocks traffic instead of leaking to
# the real IP. The .ovpn file comes from the "qbittorrent-vpn-
# config" Secret synced from Vault above.
#
# PATCH (2026-07-18): OPENVPN_USER / OPENVPN_PASSWORD removed
# from this container. The current custom.ovpn (VPNGate export)
# uses embedded certificate auth only -- "#auth-user-pass" is
# commented out in the file and <ca>/<cert>/<key> blocks are
# inline instead. Sending a username/password to a server that
# isn't expecting one caused OpenVPN's "AUTH_FAILED" error. The
# qbittorrent-vpn-config Secret/ExternalSecret still defines
# these keys (harmless, unused) in case a future provider swap
# needs them back -- just re-add the two env entries below if
# that happens.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: rustfs
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: set-webui-credentials
          image: python:3.12-alpine
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          env:
            - name: QBITTORRENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-vpn-config
                  key: QBITTORRENT_USERNAME
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-vpn-config
                  key: QBITTORRENT_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /config
          command:
            - python3
            - -c
            - |
              import os, base64, hashlib, configparser, pathlib

              conf_dir = pathlib.Path("/config/qBittorrent")
              conf_dir.mkdir(parents=True, exist_ok=True)
              conf_path = conf_dir / "qBittorrent.conf"

              cp = configparser.ConfigParser(strict=False)
              cp.optionxform = str  # preserve case and backslashes in key names
              if conf_path.exists():
                  cp.read(conf_path)

              if "Preferences" not in cp:
                  cp["Preferences"] = {}

              username = os.environ["QBITTORRENT_USERNAME"]
              password = os.environ["QBITTORRENT_PASSWORD"].encode()

              salt = os.urandom(16)
              digest = hashlib.pbkdf2_hmac("sha512", password, salt, 100000)
              b64_salt = base64.b64encode(salt).decode()
              b64_hash = base64.b64encode(digest).decode()

              cp["Preferences"]["WebUI\\Username"] = username
              cp["Preferences"]["WebUI\\Password_PBKDF2"] = (
                  f'"@ByteArray({b64_salt}:{b64_hash})"'
              )

              with open(conf_path, "w") as f:
                  cp.write(f, space_around_delimiters=False)

              print(f"WebUI credentials set for user '{username}'")
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:latest
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "custom"
            - name: VPN_TYPE
              value: "openvpn"
            - name: OPENVPN_CUSTOM_CONFIG
              value: "/gluetun/custom.ovpn"
            - name: TZ
              value: "Etc/UTC"
            - name: DOT
              value: "off"
            - name: DNS_ADDRESS
              value: "1.1.1.1"
            - name: HEALTH_SERVER_ADDRESS
              value: "0.0.0.0:9999"
          volumeMounts:
            - name: vpn-config
              mountPath: /gluetun/custom.ovpn
              subPath: custom.ovpn
            - name: dev-tun
              mountPath: /dev/net/tun
          ports:
            - containerPort: 8080
              name: webui
            - containerPort: 6881
              name: torrent-tcp
              protocol: TCP
            - containerPort: 6881
              name: torrent-udp
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2500m"
              memory: "4Gi"
          envFrom:
            - configMapRef:
                name: servarr-env
          env:
            - name: WEBUI_PORT
              value: "8080"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: downloads
          hostPath:
            path: /home/groot/downloads
            type: DirectoryOrCreate
        - name: vpn-config
          secret:
            secretName: qbittorrent-vpn-config
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: rustfs
spec:
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
    - name: torrent-tcp
      port: 6881
      targetPort: 6881
      protocol: TCP
    - name: torrent-udp
      port: 6881
      targetPort: 6881
      protocol: UDP
  type: LoadBalancer
---
# ============================================================
# SONARR (TV shows)
# Mounts a SEPARATE host path from Radarr's movies library so
# the two apps never write into the same folder.
#
# livenessProbe added: the /tv path is a FUSE mount owned by
# Jellyfin's rclone-mount sidecar (see jellyfin manifest). Every
# time that sidecar restarts, it tears down and recreates the
# FUSE connection, which can leave already-running containers
# (this one) holding a dead mount reference -- "Socket not
# connected" / "Transport endpoint is not connected". This probe
# detects that condition and lets Kubernetes restart this pod
# automatically to pick up a fresh mount, instead of it sitting
# broken until someone notices and restarts it by hand.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: rustfs
  labels:
    app: sonarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: jellyfin
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          envFrom:
            - configMapRef:
                name: servarr-env
          ports:
            - containerPort: 8989
              name: web
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: media
              mountPath: /tv
              mountPropagation: HostToContainer
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mountpoint -q /tv && ls /tv >/dev/null 2>&1"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # attempt clean unmount of FUSE-backed media path to avoid stale mounts
                    fusermount -uz /tv 2>/dev/null || umount -l /tv 2>/dev/null || true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: downloads
          hostPath:
            path: /home/groot/downloads
            type: DirectoryOrCreate
        - name: media
          hostPath:
            path: /home/groot/jellyfin-tv     # <-- separate from movies path
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: rustfs
spec:
  selector:
    app: sonarr
  ports:
    - port: 8989
      targetPort: 8989
  type: ClusterIP
---
# ============================================================
# RADARR (Movies)
# Mounted at /mnt/jellyfin-rustfs, which is Jellyfin's FUSE
# mountpoint for rustfs:movies. mountPropagation:HostToContainer
# is required for Radarr to actually see the FUSE-mounted files.
#
# livenessProbe added: same rationale as Sonarr above -- detects
# a dead FUSE reference at /movies caused by the Jellyfin
# rclone-mount sidecar restarting, and lets Kubernetes self-heal
# this pod automatically.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: rustfs
  labels:
    app: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: jellyfin
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          envFrom:
            - configMapRef:
                name: servarr-env
          ports:
            - containerPort: 7878
              name: web
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: media
              mountPath: /movies
              mountPropagation: HostToContainer
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mountpoint -q /movies && ls /movies >/dev/null 2>&1"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # attempt clean unmount of FUSE-backed media path to avoid stale mounts
                    fusermount -uz /movies 2>/dev/null || umount -l /movies 2>/dev/null || true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: downloads
          hostPath:
            path: /home/groot/downloads
            type: DirectoryOrCreate
        - name: media
          hostPath:
            path: /home/groot/jellyfin-movies
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: rustfs
spec:
  selector:
    app: radarr
  ports:
    - port: 7878
      targetPort: 7878
  type: ClusterIP
---
# ============================================================
# PROWLARR
# No media/downloads access needed - it only talks to indexers
# and pushes config to Sonarr/Radarr via their APIs.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: rustfs
  labels:
    app: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          envFrom:
            - configMapRef:
                name: servarr-env
          ports:
            - containerPort: 9696
              name: web
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: rustfs
spec:
  selector:
    app: prowlarr
  ports:
    - port: 9696
      targetPort: 9696
  type: ClusterIP
---
# ============================================================
# FLARESOLVERR
# Proxy service that solves Cloudflare (and similar JS/captcha)
# challenges on behalf of Prowlarr indexers. No config volume
# needed - it's stateless. No media/downloads access needed either.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: rustfs
  labels:
    app: flaresolverr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: "Etc/UTC"     # match servarr-env TZ
          ports:
            - containerPort: 8191
              name: web
          resources:
            # Chromium under the hood - give it real headroom or
            # it OOMs on tougher Cloudflare challenges.
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "3000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8191
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 12 
          livenessProbe:
            httpGet:
              path: /health
              port: 8191
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: rustfs
spec:
  selector:
    app: flaresolverr
  ports:
    - port: 8191
      targetPort: 8191
  type: ClusterIP